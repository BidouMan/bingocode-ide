<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>精灵编辑器 · 中心点标注原型</title>
<style>
  /* ============ 复用 BingoCodeIDE QSS 配色 ============ */
  :root {
    --bg: #22252B;          /* 主背景 */
    --panel: #292C34;       /* 编辑区/面板 */
    --border: #0C0C0C;
    --hover: #3D4048;
    --accent: #5BFB84;      /* 强调绿 */
    --accent-dim: rgba(91, 251, 132, .35);
    --text: #C8CCD4;
    --text-dim: #8A8F98;
    --warn: #E5C07B;
    --override: #61AFEF;    /* 单帧覆盖标记色 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 12px;
  }

  .sprite-editor-page { display: flex; height: 100vh; }

  /* ============ 左: 造型列表 ============ */
  .costume-list-wrap {
    width: 108px; flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .costume-list { flex: 1; overflow-y: auto; padding: 6px; }
  .costume-item {
    position: relative; padding: 4px; margin-bottom: 6px;
    border: 2px solid transparent; border-radius: 4px;
    cursor: pointer; text-align: center;
    background: var(--panel);
  }
  .costume-item:hover { background: var(--hover); }
  .costume-item-active { border-color: var(--accent); }
  .costume-thumb-box {
    width: 84px; height: 84px; margin: 0 auto;
    background:
      conic-gradient(#2e3138 0 25%, #262930 0 50%, #2e3138 0 75%, #262930 0) 0 0/16px 16px;
    border-radius: 2px; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .costume-frame-num { color: var(--text-dim); font-size: 10px; line-height: 16px; display: block; }
  /* 单帧覆盖角标 */
  .override-badge {
    position: absolute; top: 3px; right: 3px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--override); box-shadow: 0 0 4px var(--override);
  }
  .override-badge[hidden] { display: none; }

  /* ============ 中: 画布区 ============ */
  .canvas-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* 标注图层工具条（新增 UI） */
  .anno-toolbar {
    height: 36px; flex-shrink: 0;
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .anno-label { color: var(--text-dim); margin-right: 2px; letter-spacing: 1px; }
  .layer-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 4px;
    border: 1px solid var(--hover); background: transparent;
    color: var(--text-dim); cursor: pointer; font-size: 12px;
  }
  .layer-chip:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .layer-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(91,251,132,.08); }
  .layer-chip:disabled { opacity: .38; cursor: not-allowed; }
  .layer-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .layer-chip .soon { font-size: 9px; opacity: .7; margin-left: 2px; }
  .anno-hint { margin-left: auto; color: var(--text-dim); font-size: 11px; }

  .sprite-canvas {
    flex: 1; position: relative; overflow: hidden;
    background:
      linear-gradient(45deg, #262930 25%, transparent 25%, transparent 75%, #262930 75%) 0 0/24px 24px,
      linear-gradient(45deg, #262930 25%, #22252B 25%, #22252B 75%, #262930 75%) 12px 12px/24px 24px;
    cursor: grab;
  }
  .sprite-canvas.is-panning { cursor: grabbing; }
  .canvas-center-anchor {
    position: absolute; left: 50%; top: 50%;
    width: 0; height: 0;
  }
  .canvas-transform {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
  }
  /* 帧图像盒：按 offset 定位在逻辑画布内 */
  .frame-box { position: absolute; overflow: hidden; outline: 1px dashed rgba(200,204,212,.18); }
  .frame-box img { position: absolute; display: block; image-rendering: pixelated; }

  /* 中心点手柄 */
  .pivot-handle {
    position: absolute; width: 0; height: 0; cursor: move; z-index: 5;
  }
  .pivot-ring {
    position: absolute; left: -11px; top: -11px; width: 22px; height: 22px;
    border: 2px solid var(--accent); border-radius: 50%;
    background: rgba(91,251,132,.12);
    box-shadow: 0 0 6px rgba(91,251,132,.5);
  }
  .pivot-ring::before, .pivot-ring::after {
    content: ""; position: absolute; background: var(--accent);
  }
  .pivot-ring::before { left: 50%; top: -6px; width: 1.5px; height: 32px; margin-left: -.75px; }
  .pivot-ring::after  { top: 50%; left: -6px; height: 1.5px; width: 32px; margin-top: -.75px; }
  .pivot-handle.override-mode .pivot-ring {
    border-color: var(--override); box-shadow: 0 0 6px var(--override);
  }
  .pivot-handle.override-mode .pivot-ring::before,
  .pivot-handle.override-mode .pivot-ring::after { background: var(--override); }
  .pivot-handle.override-mode .pivot-ring { background: rgba(97,175,239,.12); }

  /* 洋葱皮幽灵（相邻帧有效 pivot） */
  .pivot-ghost {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border: 1.5px dashed var(--warn); border-radius: 50%;
    opacity: .55; pointer-events: none; z-index: 4;
  }
  .pivot-ghost-label {
    position: absolute; font-size: 10px; color: var(--warn);
    white-space: nowrap; opacity: .95; pointer-events: none; z-index: 4;
    transform-origin: 0 0; margin: 10px 0 0 10px;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
    font-weight: 600;
  }

  /* 底部浮动属性条（新增 UI） */
  .anno-props {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 8px;
    background: rgba(41,44,52,.92); border: 1px solid var(--hover);
    box-shadow: 0 4px 16px rgba(0,0,0,.45);
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  .props-title { color: var(--accent); font-weight: 600; margin-right: 2px; white-space: nowrap; }
  .props-sep { width: 1px; height: 18px; background: var(--hover); }
  .coord-group { display: flex; align-items: center; gap: 4px; }
  .coord-group label { color: var(--text-dim); }
  .coord-input {
    width: 52px; padding: 3px 5px; border-radius: 3px;
    border: 1px solid var(--hover); background: var(--bg); color: var(--text);
    font-size: 12px; text-align: right; outline: none;
  }
  .coord-input:focus { border-color: var(--accent); }
  /* 作用域分段控件 */
  .scope-seg { display: flex; border: 1px solid var(--hover); border-radius: 4px; overflow: hidden; }
  .scope-seg button {
    padding: 4px 10px; border: none; background: transparent; color: var(--text-dim);
    cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .scope-seg button:hover { background: var(--hover); }
  .scope-seg button.on { background: var(--accent); color: #10131A; font-weight: 600; }
  .scope-seg button.on.override-on { background: var(--override); }
  /* 预设按钮 */
  .preset-btn {
    padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--hover); background: transparent; color: var(--text);
    white-space: nowrap;
  }
  .preset-btn:hover { background: var(--hover); border-color: var(--text-dim); }
  .clear-override-btn {
    padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--override); background: rgba(97,175,239,.1); color: var(--override);
    white-space: nowrap;
  }
  .clear-override-btn:hover { background: rgba(97,175,239,.22); }
  .clear-override-btn[hidden] { display: none; }
  .scope-tip { color: var(--text-dim); font-size: 10px; max-width: 120px; line-height: 1.3; }

  /* ============ 右: 动画面板 ============ */
  .preview-panel {
    width: 264px; flex-shrink: 0;
    background: var(--bg); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 10px;
  }
  .preview-label { color: var(--text-dim); letter-spacing: 2px; font-size: 11px; margin-bottom: 8px; }
  .preview-bg {
    width: 244px; height: 244px; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--hover); position: relative;
  }
  .preview-bg.bg0 { background: #3A3D46; }
  .preview-bg.bg1 { background: #C8CCD4; }
  .preview-bg.bg2 {
    background: conic-gradient(#B0B4BC 0 25%, #8A8F98 0 50%, #B0B4BC 0 75%, #8A8F98 0) 0 0/20px 20px;
  }
  .preview-stage { position: absolute; left: 50%; top: 50%; }
  .preview-frame-box { position: absolute; overflow: hidden; }
  .preview-frame-box img { position: absolute; display: block; image-rendering: pixelated; }
  /* 预览内只读 pivot 标记 */
  .preview-pivot-dot {
    position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; border: 2px solid var(--accent);
    background: rgba(91,251,132,.3); pointer-events: none; z-index: 3;
  }
  .preview-pivot-dot.is-override { border-color: var(--override); background: rgba(97,175,239,.3); }

  .preview-btns { display: flex; gap: 6px; margin: 10px 0; }
  .prev-btn {
    width: 30px; height: 26px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--hover); background: var(--panel); color: var(--text);
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .prev-btn:hover { background: var(--hover); }
  .prev-btn.active { border-color: var(--accent); color: var(--accent); }

  .anim-list { flex: 1; overflow-y: auto; }
  .anim-item {
    padding: 7px 8px; border-radius: 4px; margin-bottom: 4px; cursor: pointer;
    background: var(--panel); border: 1px solid transparent;
  }
  .anim-item:hover { background: var(--hover); }
  .anim-item-active { border-color: var(--accent); }
  .anim-item-row { display: flex; align-items: center; justify-content: space-between; }
  .anim-name { font-weight: 600; }
  .anim-range { color: var(--text-dim); font-size: 11px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 4px; z-index: 99;
    background: var(--accent); color: #10131A; font-weight: 600;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="sprite-editor-page">
    <!-- 左: 造型列表 -->
    <div class="costume-list-wrap">
      <div class="costume-list" id="costumeList"></div>
    </div>

    <!-- 中: 画布列 -->
    <div class="canvas-col">
      <!-- 标注图层工具条 -->
      <div class="anno-toolbar">
        <span class="anno-label">标注图层</span>
        <button class="layer-chip active" id="layerPivot"><span class="dot"></span>中心点</button>
        <button class="layer-chip" disabled title="即将推出">碰撞<span class="soon">即将</span></button>
        <button class="layer-chip" disabled title="即将推出">挂点<span class="soon">即将</span></button>
        <span class="anno-hint">拖动十字手柄调整中心点 · 滚轮缩放 · 拖动空白平移 · 双击复位</span>
      </div>

      <!-- 画布 -->
      <div class="sprite-canvas" id="canvas">
        <div class="canvas-center-anchor">
          <div class="canvas-transform" id="canvasTransform"></div>
        </div>

        <!-- 底部浮动属性条 -->
        <div class="anno-props" id="annoProps">
          <span class="props-title">中心点</span>
          <div class="coord-group">
            <label>X</label><input class="coord-input" id="inputX" type="number" step="0.5" />
          </div>
          <div class="coord-group">
            <label>Y</label><input class="coord-input" id="inputY" type="number" step="0.5" />
          </div>
          <div class="props-sep"></div>
          <div class="scope-seg" id="scopeSeg" title="编辑作用域：全部帧统一修改，或只改当前帧">
            <button id="scopeAll" class="on">全部帧</button>
            <button id="scopeOne">仅当前帧</button>
          </div>
          <span class="scope-tip" id="scopeTip">修改将应用到所有帧</span>
          <div class="props-sep"></div>
          <button class="preset-btn" id="presetCenter" title="画布几何中心">中心</button>
          <button class="preset-btn" id="presetFeet" title="内容底部中心（贴地角色用）">脚底</button>
          <button class="clear-override-btn" id="clearOverride" hidden title="删除本帧覆盖，恢复为统一值">恢复统一</button>
        </div>
      </div>
    </div>

    <!-- 右: 动画预览 -->
    <div class="preview-panel">
      <div class="preview-label">ANIMATION</div>
      <div class="preview-bg bg0" id="previewBg">
        <div class="preview-stage" id="previewStage"></div>
      </div>
      <div class="preview-btns">
        <button class="prev-btn" id="btnPrev" title="上一帧">◀</button>
        <button class="prev-btn" id="btnPlay" title="播放/暂停">▶</button>
        <button class="prev-btn" id="btnNext" title="下一帧">▶|</button>
        <button class="prev-btn" id="btnBg" title="切换背景">BG</button>
      </div>
      <div class="anim-list">
        <div class="anim-item anim-item-active">
          <div class="anim-item-row">
            <span class="anim-name">walk</span>
            <span class="anim-range">1 - <span id="animEnd">14</span> 帧</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

// 内容并集（用于“脚底”预设）
const contentBox = (() => {
  let maxX = 0, maxY = 0;
  for (const f of FRAMES) {
    maxX = Math.max(maxX, f.offset.x + f.rect.w);
    maxY = Math.max(maxY, f.offset.y + f.rect.h);
  }
  return { maxX, maxY };
})();

/* ================= 画布视图状态 ================= */
let zoom = 6, panX = -CANVAS.w * 6 / 2, panY = -CANVAS.h * 6 / 2;

function effPivot(i) {
  return overrides.get(i) || spritePivot;
}
function isOverridden(i) { return overrides.has(i); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1400);
}

/* ================= 左: 造型列表 ================= */
function renderCostumes() {
  const list = document.getElementById('costumeList');
  list.innerHTML = '';
  FRAMES.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'costume-item' + (i === current ? ' costume-item-active' : '');
    item.title = '第 ' + (i + 1) + ' 帧' + (isOverridden(i) ? '（中心点单帧覆盖）' : '');
    const scale = 76 / Math.max(f.rect.w, f.rect.h);
    item.innerHTML = `
      <div class="costume-thumb-box">
        <div style="position:relative;width:${f.rect.w * scale}px;height:${f.rect.h * scale}px;overflow:hidden">
          <img src="${SHEET_SRC}" style="
            position:absolute;
            left:${-f.rect.x * scale}px; top:${-f.rect.y * scale}px;
            width:${368 * scale}px; height:${448 * scale}px;
            image-rendering:pixelated" />
        </div>
      </div>
      <span class="costume-frame-num">帧 ${i + 1}</span>
      <span class="override-badge" ${isOverridden(i) ? '' : 'hidden'} title="单帧覆盖"></span>`;
    item.addEventListener('click', () => { current = i; renderAll(); });
    list.appendChild(item);
  });
}

/* ================= 中: 画布渲染 ================= */
function renderCanvas() {
  const root = document.getElementById('canvasTransform');
  root.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  const f = FRAMES[current];
  const p = effPivot(current);

  // 相邻帧幽灵（洋葱皮）：当有效 pivot 不同时显示
  let ghosts = '';
  for (const ni of [current - 1, current + 1]) {
    if (ni < 0 || ni >= FRAMES.length) continue;
    const np = effPivot(ni);
    if (Math.abs(np.x - p.x) < .01 && Math.abs(np.y - p.y) < .01) continue;
    ghosts += `<div class="pivot-ghost" style="left:${np.x}px;top:${np.y}px"></div>
      <div class="pivot-ghost-label" style="left:${np.x}px;top:${np.y}px;transform:scale(${1 / zoom})">${isOverridden(ni) ? '帧' + (ni + 1) + ' 覆盖' : '统一值'}</div>`;
  }

  root.innerHTML = `
    <div class="frame-box" style="left:${f.offset.x}px;top:${f.offset.y}px;width:${f.rect.w}px;height:${f.rect.h}px">
      <img src="${SHEET_SRC}" style="
        left:${-f.rect.x}px; top:${-f.rect.y}px;
        width:${368}px; height:${448}px" />
    </div>
    ${ghosts}
    <div class="pivot-handle ${scope === 'one' ? 'override-mode' : ''}"
         id="pivotHandle" title="${scope === 'one' ? '单帧覆盖模式' : '统一模式（全部帧）'}"
         style="left:${p.x}px;top:${p.y}px">
      <div class="pivot-ring"></div>
    </div>`;

  const handle = document.getElementById('pivotHandle');
  handle.addEventListener('mousedown', onPivotDown);
}

/* ================= 右: 预览渲染 ================= */
let previewScale = 1.6;
function renderPreview() {
  const stage = document.getElementById('previewStage');
  const f = FRAMES[current];
  const p = effPivot(current);
  const s = previewScale;
  stage.innerHTML = `
    <div class="preview-frame-box" style="left:${-p.x * s}px;top:${-p.y * s}px;width:${f.rect.w * s}px;height:${f.rect.h * s}px">
      <img src="${SHEET_SRC}" style="
        left:${-f.rect.x * s}px; top:${-f.rect.y * s}px;
        width:${368 * s}px; height:${448 * s}px" />
    </div>
    <div class="preview-pivot-dot ${isOverridden(current) ? 'is-override' : ''}"
         style="left:0;top:0" title="只读显示中心点"></div>`;
}

/* ================= 属性条 ================= */
function renderProps() {
  const p = effPivot(current);
  document.getElementById('inputX').value = p.x.toFixed(1);
  document.getElementById('inputY').value = p.y.toFixed(1);

  const sAll = document.getElementById('scopeAll');
  const sOne = document.getElementById('scopeOne');
  sAll.classList.toggle('on', scope === 'all');
  sOne.classList.toggle('on', scope === 'one');
  sOne.classList.toggle('override-on', scope === 'one');
  document.getElementById('scopeTip').textContent =
    scope === 'all' ? '修改将应用到所有帧' : '仅写入当前帧覆盖';
  document.getElementById('clearOverride').hidden = !isOverridden(current);
}

function renderAll() {
  renderCostumes(); renderCanvas(); renderPreview(); renderProps();
}

/* ================= 交互：拖动中心点 ================= */
let dragging = false;
function onPivotDown(e) {
  e.stopPropagation(); e.preventDefault();
  dragging = true;
  document.getElementById('canvas').classList.add('is-panning');
}
document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const canvas = document.getElementById('canvas');
  const rect = canvas.getBoundingClientRect();
  // 屏幕坐标 → 逻辑画布坐标（考虑 anchor 居中 + pan + zoom）
  const cx = rect.width / 2, cy = rect.height / 2;
  const lx = (e.clientX - rect.left - cx - panX) / zoom;
  const ly = (e.clientY - rect.top - cy - panY) / zoom;
  const target = { x: Math.round(lx * 2) / 2, y: Math.round(ly * 2) / 2 }; // 0.5 吸附
  if (scope === 'all') spritePivot = target;
  else overrides.set(current, target);
  renderCanvas(); renderPreview(); renderProps();
  // 拖动时不重渲染列表（性能）
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  document.getElementById('canvas').classList.remove('is-panning');
  renderCostumes();
});

/* ================= 交互：画布平移 / 缩放 ================= */
const canvasEl = document.getElementById('canvas');
let panning = false, lastX = 0, lastY = 0;
canvasEl.addEventListener('mousedown', (e) => {
  if (e.target.closest('.pivot-handle') || e.target.closest('.anno-props')) return;
  panning = true; lastX = e.clientX; lastY = e.clientY;
  canvasEl.classList.add('is-panning');
});
canvasEl.addEventListener('mousemove', (e) => {
  if (!panning) return;
  panX += e.clientX - lastX; panY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  document.getElementById('canvasTransform').style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;
});
canvasEl.addEventListener('mouseup', () => { panning = false; canvasEl.classList.remove('is-panning'); });
canvasEl.addEventListener('mouseleave', () => { panning = false; canvasEl.classList.remove('is-panning'); });
canvasEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoom = Math.min(20, Math.max(1.5, zoom * factor));
  document.getElementById('canvasTransform').style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;
}, { passive: false });
canvasEl.addEventListener('dblclick', () => {
  zoom = 6; panX = -CANVAS.w * 6 / 2; panY = -CANVAS.h * 6 / 2;
  document.getElementById('canvasTransform').style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;
});

/* ================= 交互：作用域 / 预设 / 数值 / 恢复 ================= */
document.getElementById('scopeAll').addEventListener('click', () => {
  scope = 'all';
  // 切回统一：当前帧若有覆盖，保留覆盖但编辑写默认（覆盖仍显示）
  toast('统一模式：修改应用到全部帧');
  renderAll();
});
document.getElementById('scopeOne').addEventListener('click', () => {
  scope = 'one';
  if (!overrides.has(current)) overrides.set(current, { ...effPivot(current) });
  toast('单帧模式：仅修改当前帧');
  renderAll();
});
document.getElementById('presetCenter').addEventListener('click', () => {
  const p = { x: CANVAS.w / 2, y: CANVAS.h / 2 };
  if (scope === 'all') spritePivot = p; else overrides.set(current, p);
  renderAll(); toast('已应用「中心」预设');
});
document.getElementById('presetFeet').addEventListener('click', () => {
  // 脚底 = 内容并集底部中心
  const p = { x: Math.round(contentBox.maxX / 2), y: contentBox.maxY };
  if (scope === 'all') spritePivot = p; else overrides.set(current, p);
  renderAll(); toast('已应用「脚底」预设');
});
document.getElementById('clearOverride').addEventListener('click', () => {
  overrides.delete(current);
  renderAll(); toast('已恢复为统一值');
});
function bindCoord(inputId, axis) {
  document.getElementById(inputId).addEventListener('change', (e) => {
    const v = Number(e.target.value); if (isNaN(v)) return;
    const p = { ...effPivot(current) }; p[axis] = v;
    if (scope === 'all') spritePivot = p; else overrides.set(current, p);
    renderAll();
  });
}
bindCoord('inputX', 'x'); bindCoord('inputY', 'y');

/* ================= 预览播放 ================= */
let playing = false, playTimer = null;
document.getElementById('btnPlay').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btnPlay').textContent = playing ? '❚❚' : '▶';
  document.getElementById('btnPlay').classList.toggle('active', playing);
  if (playing) {
    playTimer = setInterval(() => {
      current = (current + 1) % FRAMES.length;
      renderCostumes(); renderCanvas(); renderPreview(); renderProps();
    }, 1000 / 8);
  } else clearInterval(playTimer);
});
document.getElementById('btnPrev').addEventListener('click', () => {
  current = (current - 1 + FRAMES.length) % FRAMES.length; renderAll();
});
document.getElementById('btnNext').addEventListener('click', () => {
  current = (current + 1) % FRAMES.length; renderAll();
});
let bgIdx = 0;
document.getElementById('btnBg').addEventListener('click', () => {
  bgIdx = (bgIdx + 1) % 3;
  const el = document.getElementById('previewBg');
  el.className = 'preview-bg bg' + bgIdx;
});

/* 初始化 */
document.getElementById('animEnd').textContent = FRAMES.length;
renderAll();
</script>
</body>
</html>
