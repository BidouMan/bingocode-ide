name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - macos
          - both

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{
            github.event_name == 'workflow_dispatch' && (
              github.event.inputs.platform == 'windows' && fromJSON('["windows-latest"]') ||
              github.event.inputs.platform == 'macos' && fromJSON('["macos-latest"]') ||
              fromJSON('["macos-latest", "windows-latest"]')
            ) || fromJSON('["macos-latest", "windows-latest"]')
          }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: pnpm install

      - name: Setup portable Python engine
        shell: bash
        run: |
          set -euo pipefail

          # Windows: 转换反斜杠为正斜杠（tar 不支持反斜杠路径）
          RAW_WS="${{ github.workspace }}"
          case "${{ runner.os }}" in
            Windows) WS="${RAW_WS//\\//}" ;;
            *)       WS="$RAW_WS" ;;
          esac

          ENGINE_DIR="$WS/engine"
          OUTPUT_DIR="$ENGINE_DIR/portable-python"

          # 根据 runner OS 选择架构
          case "${{ runner.os }}" in
            macOS)
              case "$(uname -m)" in
                arm64)  PLATFORM="aarch64-apple-darwin" ;;
                x86_64) PLATFORM="x86_64-apple-darwin" ;;
                *) echo "Unknown arch: $(uname -m)"; exit 1 ;;
              esac
              ;;
            Windows)
              PLATFORM="x86_64-pc-windows-msvc"
              ;;
            *)
              echo "Unsupported OS: ${{ runner.os }}"
              exit 1
              ;;
          esac

          PYTHON_VERSION="3.12.13"
          RELEASE_TAG="20260623"
          FILENAME="cpython-${PYTHON_VERSION}+${RELEASE_TAG}-${PLATFORM}-install_only_stripped.tar.gz"
          DOWNLOAD_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${RELEASE_TAG}/${FILENAME}"

          echo "🔍 Platform: $PLATFORM"
          echo "📥 Downloading $FILENAME ..."

          mkdir -p "$OUTPUT_DIR"
          curl -L --retry 3 --retry-delay 5 -o "/tmp/${FILENAME}" "$DOWNLOAD_URL"
          tar -xzf "/tmp/${FILENAME}" -C "$OUTPUT_DIR" --strip-components=1
          rm "/tmp/${FILENAME}"

          # 找到 Python
          if [ -f "$OUTPUT_DIR/bin/python3" ]; then
            PYTHON_BIN="$OUTPUT_DIR/bin/python3"
          elif [ -f "$OUTPUT_DIR/bin/python" ]; then
            PYTHON_BIN="$OUTPUT_DIR/bin/python"
          elif [ -f "$OUTPUT_DIR/python.exe" ]; then
            PYTHON_BIN="$OUTPUT_DIR/python.exe"
          else
            echo "❌ Python binary not found"; exit 1
          fi

          echo "🐍 $($PYTHON_BIN --version 2>&1)"

          # 升级 pip 并安装依赖
          "$PYTHON_BIN" -m pip install --upgrade pip --quiet
          "$PYTHON_BIN" -m pip install -r "$ENGINE_DIR/requirements.txt" --no-compile --quiet
          echo "✅ Dependencies installed"

          # 清理无用文件
          find "$OUTPUT_DIR" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$OUTPUT_DIR" -name "*.pyc" -delete 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/var/cache" "$OUTPUT_DIR/.cache" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/test" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/idlelib" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/tkinter" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/turtledemo" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/unittest" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/ensurepip" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/include" 2>/dev/null || true

          echo "✅ Portable Python ready"
          du -sh "$OUTPUT_DIR"

      - name: Verify portable Python before build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY_BIN="$GITHUB_WORKSPACE/engine/portable-python/python.exe"
          else
            PY_BIN="$GITHUB_WORKSPACE/engine/portable-python/bin/python3"
          fi

          if [ ! -e "$PY_BIN" ]; then
            echo "❌ FATAL: Python binary not found at: $PY_BIN"
            exit 1
          fi

          echo "🐍 Verifying Python at: $PY_BIN"
          VERSION_OUTPUT=$("$PY_BIN" --version 2>&1) || {
            echo "❌ FATAL: Python binary not executable: $PY_BIN"
            exit 1
          }
          echo "✅ Python executable: $VERSION_OUTPUT"

          DEP_CHECK=$("$PY_BIN" -c "import PIL, numpy; print('deps OK')" 2>&1) || {
            echo "⚠️  WARNING: Python dependencies missing: $DEP_CHECK"
          }
          echo "✅ $DEP_CHECK"

      - name: Setup update signing key
        shell: bash
        run: |
          echo "✅ 私钥将通过环境变量传递到签名步骤"

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Generate updater artifacts
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          echo "📦 生成更新包，版本: $VERSION"

          BUNDLE_DIR="src-tauri/target/release/bundle"
          UPDATER_DIR="src-tauri/target/release/bundle/updater"
          mkdir -p "$UPDATER_DIR"

          # 确定正确的 OpenSSL 路径（macOS 系统自带 LibreSSL 不支持 Ed25519）
          OPENSSL="openssl"
          if [ "${{ runner.os }}" = "macOS" ]; then
            if ! [ -x "/opt/homebrew/opt/openssl@3/bin/openssl" ]; then
              echo "🍺 安装 openssl@3..."
              brew install openssl@3 >/dev/null 2>&1
            fi
            if [ -x "/opt/homebrew/opt/openssl@3/bin/openssl" ]; then
              OPENSSL="/opt/homebrew/opt/openssl@3/bin/openssl"
            else
              echo "⚠️ openssl@3 安装失败，将使用系统 openssl（可能不支持 Ed25519）"
            fi
          fi
          echo "🔐 使用 OpenSSL: $($OPENSSL version 2>&1 || echo 'unknown')"

          # 写入临时密钥文件（使用 RUNNER_TEMP 确保跨平台兼容）
          KEY_FILE="$RUNNER_TEMP/updater-key.pem"
          if [ -z "$UPDATER_PRIVATE_KEY" ]; then
            echo "❌ UPDATER_PRIVATE_KEY secret 未配置或为空，跳过签名"
            KEY_FILE=""
          else
            echo "$UPDATER_PRIVATE_KEY" > "$KEY_FILE"
            echo "✅ 签名密钥已写入: $KEY_FILE"

            # 导出公钥到 updater 目录（供 latest.json 使用）
            $OPENSSL pkey -in "$KEY_FILE" -pubout -out "$UPDATER_DIR/pubkey.txt"
            echo "✅ 公钥已导出"
          fi

          # macOS: 生成 .app.tar.gz
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_DIR=$(find "$BUNDLE_DIR/macos" -name "*.app" -type d | head -1)
            echo "📁 macOS APP_DIR: ${APP_DIR:-未找到}"
            if [ -n "$APP_DIR" ]; then
              APP_NAME=$(basename "$APP_DIR" .app)
              TARBALL="$UPDATER_DIR/${APP_NAME}_${VERSION}_aarch64.app.tar.gz"
              tar -czf "$TARBALL" -C "$BUNDLE_DIR/macos" "$(basename "$APP_DIR")"
              echo "✅ macOS 更新包: $TARBALL"

              # 生成签名
              if [ -n "$KEY_FILE" ]; then
                $OPENSSL pkeyutl -sign -inkey "$KEY_FILE" -in "$TARBALL" -out "$RUNNER_TEMP/mac.sig"
                SIGNATURE=$(base64 < "$RUNNER_TEMP/mac.sig" | tr -d '\n')
                echo "$SIGNATURE" > "$UPDATER_DIR/signature.txt"
                echo "✅ macOS 签名已生成"
              else
                echo "⚠️ 跳过 macOS 签名（无密钥）"
              fi
              echo "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/$(basename "$TARBALL")" > "$UPDATER_DIR/url.txt"
            fi
          fi

          # Windows: 生成 .nsis.zip
          if [ "${{ runner.os }}" = "Windows" ]; then
            INSTALLER=$(find "$BUNDLE_DIR/nsis" -name "*-setup.exe" | head -1)
            echo "📁 Windows INSTALLER: ${INSTALLER:-未找到}"
            if [ -n "$INSTALLER" ]; then
              ZIP_FILE="$UPDATER_DIR/BingoCode_${VERSION}_x64-setup.nsis.zip"
              7z a "$ZIP_FILE" "$INSTALLER"
              echo "✅ Windows 更新包: $ZIP_FILE"

              # 生成签名
              if [ -n "$KEY_FILE" ]; then
                $OPENSSL pkeyutl -sign -inkey "$KEY_FILE" -in "$ZIP_FILE" -out "$RUNNER_TEMP/win.sig"
                SIGNATURE=$(base64 < "$RUNNER_TEMP/win.sig" | tr -d '\n')
                echo "$SIGNATURE" > "$UPDATER_DIR/signature.txt"
                echo "✅ Windows 签名已生成"
              else
                echo "⚠️ 跳过 Windows 签名（无密钥）"
              fi
              echo "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/$(basename "$ZIP_FILE")" > "$UPDATER_DIR/url.txt"
            fi
          fi

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v5
        with:
          name: updater-${{ runner.os }}
          path: src-tauri/target/release/bundle/updater/
          retention-days: 7

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: bundle-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          retention-days: 7

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v5

      - name: Download all bundles
        uses: actions/download-artifact@v5
        with:
          path: bundles

      - name: Download updater artifacts
        uses: actions/download-artifact@v5
        with:
          path: updater

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          echo "📝 生成 latest.json，版本: $VERSION"

          # 读取公钥（base64 编码的 PEM，与 tauri.conf.json 格式一致）
          PUBKEY=""
          for f in "updater/updater-macOS/pubkey.txt" "updater/updater-Windows/pubkey.txt"; do
            if [ -f "$f" ]; then
              PUBKEY=$(base64 -w 0 < "$f")
              echo "✅ 从 $f 读取公钥"
              break
            fi
          done
          if [ -z "$PUBKEY" ]; then
            echo "⚠️ 未找到公钥文件"
          fi

          # 收集各平台数据（URL 和签名都必须非空才写入 latest.json）
          PLATFORMS_JSON="{}"
          for entry in "updater/updater-macOS:url.txt:signature.txt:darwin-aarch64:darwin-x86_64" "updater/updater-Windows:url.txt:signature.txt:windows-x86_64"; do
            IFS=':' read -r dir url_file sig_file target1 target2 <<< "$entry"
            URL=""
            SIG=""
            if [ -f "$dir/$url_file" ] && [ -f "$dir/$sig_file" ]; then
              URL=$(cat "$dir/$url_file")
              SIG=$(cat "$dir/$sig_file")
            fi
            if [ -n "$URL" ] && [ -n "$SIG" ]; then
              echo "✅ $target1: url=$URL"
              # 逐个 target 添加，避免引号和分词问题
              for target in $target1 $target2; do
                PLATFORMS_JSON=$(echo "$PLATFORMS_JSON" | jq \
                  --arg url "$URL" \
                  --arg sig "$SIG" \
                  --arg t "$target" \
                  '. + {($t): {signature: $sig, url: $url}}')
              done
            else
              echo "⚠️ $target1: 缺少签名或URL，跳过"
            fi
          done

          jq -n \
            --arg version "v${VERSION}" \
            --arg notes "Version ${VERSION}" \
            --arg pubkey "${PUBKEY}" \
            --argjson platforms "$PLATFORMS_JSON" \
            '{
              version: $version,
              notes: $notes,
              pubkey: $pubkey,
              platforms: $platforms
            }' > latest.json

          echo "✅ latest.json 已生成"
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/**/*.dmg
            bundles/**/*.exe
            bundles/**/*.zip
            updater/**/*.tar.gz
            updater/**/*.zip
            latest.json
          generate_release_notes: true
          make_latest: true

      - name: Commit latest.json to repo for CDN cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin master --rebase
          cp latest.json ./latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m "chore: update latest.json for CDN cache"
          git push origin master
