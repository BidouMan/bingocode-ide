name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - macos
          - both

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{
            github.event_name == 'workflow_dispatch' && (
              github.event.inputs.platform == 'windows' && fromJSON('["windows-latest"]') ||
              github.event.inputs.platform == 'macos' && fromJSON('["macos-latest"]') ||
              fromJSON('["macos-latest", "windows-latest"]')
            ) || fromJSON('["macos-latest", "windows-latest"]')
          }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: pnpm install

      - name: Setup portable Python engine
        shell: bash
        run: |
          set -euo pipefail

          # Windows: 转换反斜杠为正斜杠（tar 不支持反斜杠路径）
          RAW_WS="${{ github.workspace }}"
          case "${{ runner.os }}" in
            Windows) WS="${RAW_WS//\\//}" ;;
            *)       WS="$RAW_WS" ;;
          esac

          ENGINE_DIR="$WS/engine"
          OUTPUT_DIR="$ENGINE_DIR/portable-python"

          # 根据 runner OS 选择架构
          case "${{ runner.os }}" in
            macOS)
              case "$(uname -m)" in
                arm64)  PLATFORM="aarch64-apple-darwin" ;;
                x86_64) PLATFORM="x86_64-apple-darwin" ;;
                *) echo "Unknown arch: $(uname -m)"; exit 1 ;;
              esac
              ;;
            Windows)
              PLATFORM="x86_64-pc-windows-msvc"
              ;;
            *)
              echo "Unsupported OS: ${{ runner.os }}"
              exit 1
              ;;
          esac

          PYTHON_VERSION="3.12.13"
          RELEASE_TAG="20260623"
          FILENAME="cpython-${PYTHON_VERSION}+${RELEASE_TAG}-${PLATFORM}-install_only_stripped.tar.gz"
          DOWNLOAD_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${RELEASE_TAG}/${FILENAME}"

          echo "🔍 Platform: $PLATFORM"
          echo "📥 Downloading $FILENAME ..."

          mkdir -p "$OUTPUT_DIR"
          curl -L --retry 3 --retry-delay 5 -o "/tmp/${FILENAME}" "$DOWNLOAD_URL"
          tar -xzf "/tmp/${FILENAME}" -C "$OUTPUT_DIR" --strip-components=1
          rm "/tmp/${FILENAME}"

          # 找到 Python
          if [ -f "$OUTPUT_DIR/bin/python3" ]; then
            PYTHON_BIN="$OUTPUT_DIR/bin/python3"
          elif [ -f "$OUTPUT_DIR/bin/python" ]; then
            PYTHON_BIN="$OUTPUT_DIR/bin/python"
          elif [ -f "$OUTPUT_DIR/python.exe" ]; then
            PYTHON_BIN="$OUTPUT_DIR/python.exe"
          else
            echo "❌ Python binary not found"; exit 1
          fi

          echo "🐍 $($PYTHON_BIN --version 2>&1)"

          # 升级 pip 并安装依赖
          "$PYTHON_BIN" -m pip install --upgrade pip --quiet
          "$PYTHON_BIN" -m pip install -r "$ENGINE_DIR/requirements.txt" --no-compile --quiet
          echo "✅ Dependencies installed"

          # 清理无用文件
          find "$OUTPUT_DIR" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$OUTPUT_DIR" -name "*.pyc" -delete 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/var/cache" "$OUTPUT_DIR/.cache" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/test" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/idlelib" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/tkinter" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/turtledemo" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/unittest" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/lib/python3.12/ensurepip" 2>/dev/null || true
          rm -rf "$OUTPUT_DIR/include" 2>/dev/null || true

          echo "✅ Portable Python ready"
          du -sh "$OUTPUT_DIR"

      - name: Verify portable Python before build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY_BIN="$GITHUB_WORKSPACE/engine/portable-python/python.exe"
          else
            PY_BIN="$GITHUB_WORKSPACE/engine/portable-python/bin/python3"
          fi

          if [ ! -e "$PY_BIN" ]; then
            echo "❌ FATAL: Python binary not found at: $PY_BIN"
            exit 1
          fi

          echo "🐍 Verifying Python at: $PY_BIN"
          VERSION_OUTPUT=$("$PY_BIN" --version 2>&1) || {
            echo "❌ FATAL: Python binary not executable: $PY_BIN"
            exit 1
          }
          echo "✅ Python executable: $VERSION_OUTPUT"

          DEP_CHECK=$("$PY_BIN" -c "import PIL, numpy; print('deps OK')" 2>&1) || {
            echo "⚠️  WARNING: Python dependencies missing: $DEP_CHECK"
          }
          echo "✅ $DEP_CHECK"

      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ FATAL: UPDATER_PRIVATE_KEY secret 未配置，构建将不生成更新包，发布中止"
            echo "   请到 GitHub 仓库 Settings → Secrets and variables → Actions 配置"
            exit 1
          fi
          echo "✅ UPDATER_PRIVATE_KEY 已配置 (长度: ${#TAURI_SIGNING_PRIVATE_KEY})"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build

      - name: List updater artifacts
        shell: bash
        run: |
          echo "📦 查找 Tauri 自动生成的更新包和签名文件..."
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "--- macOS ---"
          find "$BUNDLE_DIR/macos" -type f \( -name "*.tar.gz" -o -name "*.tar.gz.sig" \) 2>/dev/null || echo "无 macOS 更新包"
          echo "--- Windows NSIS ---"
          find "$BUNDLE_DIR/nsis" -type f \( -name "*.nsis.zip" -o -name "*.nsis.zip.sig" \) 2>/dev/null || echo "无 Windows 更新包"

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: bundle-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          retention-days: 7

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v5

      - name: Download all bundles
        uses: actions/download-artifact@v5
        with:
          path: bundles

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          echo "📝 生成 latest.json，版本: $VERSION"

          # 公钥直接从 tauri.conf.json 读取（minisign 格式）
          PUBKEY=$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json)
          echo "✅ 从 tauri.conf.json 读取公钥"

          # 收集各平台签名和 URL
          # macOS: Tauri 生成 .app.tar.gz + .app.tar.gz.sig
          # Windows: Tauri 生成 *.nsis.zip + *.nsis.zip.sig
          PLATFORMS_JSON="{}"

          # --- macOS ---
          MAC_TARGZ=""
          MAC_SIG=""
          for f in $(find bundles -name "*.app.tar.gz" -not -name "*.sig" 2>/dev/null); do
            MAC_TARGZ="$f"
            SIG_FILE="${f}.sig"
            if [ -f "$SIG_FILE" ]; then
              MAC_SIG=$(cat "$SIG_FILE" | tr -d '\n')
              echo "✅ macOS 签名已读取: $(basename "$f")"
            else
              echo "⚠️ macOS 签名文件不存在: $SIG_FILE"
            fi
            break
          done
          if [ -n "$MAC_TARGZ" ] && [ -n "$MAC_SIG" ]; then
            MAC_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/$(basename "$MAC_TARGZ")"
            # 从 DMG 文件名推断架构（macos-latest 是 ARM64）
            ARCH="aarch64"
            DMG_FILE=$(find bundles -name "*_aarch64.dmg" -o -name "*_x64.dmg" 2>/dev/null | head -1)
            if [ -n "$DMG_FILE" ]; then
              case "$(basename "$DMG_FILE")" in
                *_x64*) ARCH="x86_64" ;;
                *)      ARCH="aarch64" ;;
              esac
              echo "✅ 从 DMG 文件名推断架构: $ARCH"
            else
              echo "ℹ️ 未找到 DMG，默认架构: $ARCH (macos-latest 为 ARM64)"
            fi
            TARGET="darwin-${ARCH}"
            PLATFORMS_JSON=$(echo "$PLATFORMS_JSON" | jq \
              --arg url "$MAC_URL" \
              --arg sig "$MAC_SIG" \
              --arg t "$TARGET" \
              '. + {($t): {signature: $sig, url: $url}}')
            echo "✅ macOS ($TARGET): url=$MAC_URL"
          else
            echo "⚠️ macOS: 未找到更新包或签名"
          fi

          # --- Windows ---
          WIN_NSIS_ZIP=""
          WIN_SIG=""
          for f in $(find bundles -name "*.nsis.zip" -not -name "*.sig" 2>/dev/null); do
            WIN_NSIS_ZIP="$f"
            SIG_FILE="${f}.sig"
            if [ -f "$SIG_FILE" ]; then
              WIN_SIG=$(cat "$SIG_FILE" | tr -d '\n')
              echo "✅ Windows 签名已读取: $(basename "$f")"
            else
              echo "⚠️ Windows 签名文件不存在: $SIG_FILE"
            fi
            break
          done
          if [ -n "$WIN_NSIS_ZIP" ] && [ -n "$WIN_SIG" ]; then
            WIN_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/$(basename "$WIN_NSIS_ZIP")"
            TARGET="windows-x86_64"
            PLATFORMS_JSON=$(echo "$PLATFORMS_JSON" | jq \
              --arg url "$WIN_URL" \
              --arg sig "$WIN_SIG" \
              --arg t "$TARGET" \
              '. + {($t): {signature: $sig, url: $url}}')
            echo "✅ Windows ($TARGET): url=$WIN_URL"
          else
            echo "⚠️ Windows: 未找到更新包或签名"
          fi

          # 生成 latest.json
          jq -n \
            --arg version "v${VERSION}" \
            --arg notes "Version ${VERSION}" \
            --arg pubkey "${PUBKEY}" \
            --argjson platforms "$PLATFORMS_JSON" \
            '{
              version: $version,
              notes: $notes,
              pubkey: $pubkey,
              platforms: $platforms
            }' > latest.json

          echo "✅ latest.json 已生成"
          cat latest.json

          # 校验平台条目：为空说明构建没产出更新包，发布无意义，直接失败
          PLATFORM_COUNT=$(jq '.platforms | length' latest.json)
          if [ "$PLATFORM_COUNT" -eq 0 ]; then
            echo "❌ FATAL: latest.json 的 platforms 为空，未找到任何更新包或签名，发布中止"
            exit 1
          fi
          echo "✅ platforms 包含 $PLATFORM_COUNT 个平台条目"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/**/*.dmg
            bundles/**/*.exe
            bundles/**/*.app.tar.gz
            bundles/**/*.app.tar.gz.sig
            bundles/**/*.nsis.zip
            bundles/**/*.nsis.zip.sig
            latest.json
          generate_release_notes: true
          make_latest: true

      - name: Commit latest.json to repo for CDN cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git reset --hard origin/master
          git add latest.json
          git diff --cached --quiet || git commit -m "chore: update latest.json for CDN cache"
          git push origin HEAD:master
