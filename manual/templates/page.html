<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{PAGE_DESC}}">
  <meta name="color-scheme" content="light dark">
  <title>{{PAGE_TITLE}} · BingoCode 开发者手册</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('bingo-docs-theme')
        var preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (preferred ? 'dark' : 'light')
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
      window.__DOCS_PREFIX__ = '{{PREFIX}}'
      window.__DOCS_PAGE__ = '{{PAGE_PATH}}'
    })()
  </script>
  <link rel="stylesheet" href="{{PREFIX}}assets/docs.css">
</head>
<body data-layout="{{LAYOUT}}">
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
  <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="关闭导航" tabindex="-1"></button>

  <aside class="sidebar" id="sidebar">
    {{SIDEBAR}}
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">
          {{MENU_ICON}}
        </button>
        <nav class="breadcrumbs" aria-label="面包屑">
          {{BREADCRUMBS}}
        </nav>
      </div>

      <div class="topbar-right">
        <button class="topbar-search" type="button" data-search-open aria-label="搜索文档">
          {{SEARCH_ICON}}
          <span>搜索</span>
          <kbd>⌘K</kbd>
        </button>
        <span class="version-pill">v{{VERSION}}</span>
        <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="切换浅色 / 深色主题">
          {{THEME_ICON}}
        </button>
      </div>
    </header>

    <div class="content-wrap">
      <main class="article" id="article">
        {{PAGE_HEAD}}
        {{CONTENT}}
        {{PAGE_NAV}}

        <footer class="doc-footer">
          <div class="doc-footer-brand">
            <span class="brand-mark small">B</span>
            <div>
              <strong>BingoCode 开发者手册</strong>
              <span>对应 BingoCodeIDE v{{VERSION}} · 构建于 {{BUILD_DATE}}</span>
            </div>
          </div>
          <p>本手册独立于客户端打包，可离线阅读，也可直接部署到局域网或服务器。</p>
        </footer>
      </main>

      <aside class="toc" aria-label="本页目录">
        {{TOC}}
      </aside>
    </div>
  </div>

  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-modal" role="dialog" aria-modal="true" aria-label="搜索文档">
      <div class="search-field">
        {{SEARCH_ICON}}
        <input id="search-input" type="search" placeholder="搜索函数、属性或教程…" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="search-hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>Enter</kbd> 打开</span>
        <span>支持中文与函数名搜索</span>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭大图">×</button>
    <img id="lightbox-image" alt="">
  </div>

  <script src="{{PREFIX}}assets/search-index.js"></script>
  <script src="{{PREFIX}}assets/docs.js"></script>
</body>
</html>
