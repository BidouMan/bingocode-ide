<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}} - BingoCode 帮助文档</title>
  <link rel="stylesheet" href="{{RELATIVE_PATH}}static/docs.css">
</head>
<body>
  <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="打开导航">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar">
    <div class="sidebar-nav">
      {{SIDEBAR}}
    </div>
    <div class="sidebar-footer">
      <span>v{{VERSION}}</span>
      <span class="footer-sep">·</span>
      <span>离线可读</span>
    </div>
  </aside>

  <main class="main">
    <div class="layout{{TOC_CLASS}}{{HOME_CLASS}}">
      <article class="content">
        {{CONTENT}}
      </article>
      <aside class="toc" id="toc">
        {{TOC}}
      </aside>
    </div>
  </main>

  <script>
    const SEARCH_INDEX = {{SEARCH_INDEX}};
  </script>
  <script src="{{RELATIVE_PATH}}static/docs.js"></script>
</body>
</html>
